<style>
  :root{
    --ink:#14412b;
    --leaf:#4f8a2e;
    --leaf-soft:#6f9f4a;
    --mist:#f3f8ef;
    --card:#ffffff;
    --muted:#4d6b58;
    --shadow:0 6px 18px rgba(30,70,40,.10), 0 1px 3px rgba(30,70,40,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--mist);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
  a,button{touch-action:manipulation}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 50% -10%, #e4f0d9 0%, rgba(228,240,217,0) 70%),
      radial-gradient(500px 400px at 0% 100%, #dcebcf 0%, rgba(220,235,207,0) 70%),
      linear-gradient(180deg,#f8fbf5,#eef5e8);
    padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));
    align-items:flex-start;
    display:flex;justify-content:center;
  }
  main{width:100%;max-width:440px;text-align:center}
  .logo{width:132px;height:auto;display:block;margin:0 auto 14px}
  h1{font-family:Lora,Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,8vw,34px);line-height:1.15;letter-spacing:.2px}
  .tagline{margin-top:10px;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--leaf);font-weight:600}
  .rule{width:64px;height:2px;background:var(--leaf);margin:16px auto 18px;border-radius:2px}
  .intro{font-size:16.5px;line-height:1.5;color:var(--ink);max-width:340px;margin:0 auto 22px}
  .quick{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
  .quick a{width:54px;height:54px;border-radius:50%;background:var(--ink);display:grid;place-items:center;transition:transform .15s}
  .quick a:active{transform:scale(.94)}
  .quick svg{width:24px;height:24px;fill:#fff}
  ul{list-style:none;display:grid;gap:13px}
  .link{
    display:flex;align-items:center;gap:16px;text-align:left;text-decoration:none;color:inherit;
    background:var(--card);border-radius:999px;padding:10px 20px 10px 12px;min-height:70px;
    box-shadow:var(--shadow);border:1px solid rgba(79,138,46,.12);
    transition:transform .15s, box-shadow .15s;
  }
  @media (hover:hover){.link:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(30,70,40,.14)}}
  .link:active{transform:scale(.985)}
  .link:focus-visible,.quick a:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
  .ico{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
  .ico svg{width:26px;height:26px}
  .txt{flex:1;min-width:0}
  .txt b{display:block;overflow-wrap:anywhere;font-size:18px;font-weight:700;line-height:1.2}
  .txt span{display:block;overflow-wrap:anywhere;font-size:14px;color:var(--muted);margin-top:2px}
  .chev{flex:none;width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  footer{margin-top:30px;color:var(--muted)}
  .sep{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:12px}
  .sep i{flex:1;height:1px;background:rgba(79,138,46,.45)}
  .sep svg{width:22px;height:22px;fill:var(--leaf)}
  .motto{font-family:Lora,Georgia,serif;font-style:italic;font-size:16px;letter-spacing:.06em;color:var(--ink)}
  @media (max-width:360px){
    .logo{width:108px}
    .tagline{letter-spacing:.24em;font-size:12px}
    .intro{font-size:15.5px}
    .link{gap:12px;padding:8px 14px 8px 10px;min-height:64px}
    .ico{width:44px;height:44px}
    .txt b{font-size:16.5px}
    .txt span{font-size:13px}
  }
  @media (min-width:600px){
    body{align-items:center;padding-top:40px;padding-bottom:40px}
  }
  @media (max-height:500px) and (orientation:landscape){
    body{align-items:flex-start}
    main{max-width:520px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
